{% extends 'portfolio_app/base_template.html' %}

{% block content %}

<h2>Update Portfolio Information</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Update Portfolio</button>
    <button type="button" onclick="location.href='{% url 'portfolio_list' %}'">Cancel</button>
</form>

{% endblock %}
