{% extends 'portfolio_app/base_template.html' %}

{% block content %}

<h2>Are you sure you want to Delete {{ student.name }}?</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Confirm</button>
    <button type="button" onclick="location.href='{% url 'student_list' %}'">Cancel</button>
</form>

{% endblock %}
