{% extends "portfolio_app/base_template.html" %}

{% block content%}

<h2>{{student.name}}</h2>

<p><strong>Email:</strong> {{student.email}}</p>
<p><strong>Major:</strong> {{student.get_major_display}}</p>

<button type="button" class="btn btn-primary" onclick="location.href='{% url 'student_update' student.pk %}'">Update Student</button>
<button type="button" class="btn btn-danger" onclick="location.href='{% url 'student_delete' student.pk %}'">Delete Student</button>

{% endblock %}
