{% load django_bootstrap5 %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portfolio's</title>
    {% bootstrap_css %}
  </head>
  <body style="background-color: #353535; color: white;">
    <header>
      <nav class="navbar navbar-expand-sm navbar-dark mb-0" style="background-color: black; display: flex; justify-content: left; align-items: center; padding: 8px 8px 8px 8px;">
        <div class="">
          <ul class="navbar-nav gap-2">
            <li class="nav-item">
              <a class="nav-link active btn btn-primary" href="{% url 'portfolio_list' %}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active btn btn-primary " href="{% url 'student_list' %}">Students</a>
            </li>
          </ul>
        </div>
      </nav>
      <a href="https://github.com/OrangeSkyline/Django-Project" data-bs-toggle="tooltip" data-bs-placement="right" title="View the GitHub Repository." class="container-fluid mb-2"style="font-size: 44px; text-decoration: none; color: orange; font-weight: bold;" target="blank_">Django Portfolio Site</a>

    <main class="container-fluid mb-2">{% block content %} {% endblock %}</main>
    {% bootstrap_javascript %}
