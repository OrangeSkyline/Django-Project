{% extends "portfolio_app/base_template.html" %}

{%block content%}

<h2>Active Student Portfolio's</h2>

<ul>
    {% for portfolio in active_portfolios %}
        <li><a href="{% url 'portfolio_detail' portfolio.id %}">{{portfolio.student.name}}: {{portfolio.title}}</a></li>
    {% empty %}
        <li>No active student portfolios available.</li>
    {% endfor %}
</ul>

{% endblock %}
